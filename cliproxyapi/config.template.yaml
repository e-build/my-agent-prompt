# CLI Proxy API 서버 구성 템플릿
#
# 실제 키(secret)는 `__CLIPROXY_*__` 플레이스홀더로 남겨두고,
# `install.sh`가 환경변수 또는 기존 config에서 값을 주입해 config.yaml을 생성한다.
# 플레이스홀더를 실제 값으로 바꿔 직접 커밋하지 말 것 (저장소는 public).

port: 8317
auth-dir: "/root/.cli-proxy-api" # 컨테이너 내부의 절대 경로로 변경
remote-management:
  allow-remote: true
  secret-key: "__CLIPROXY_SECRET_KEY__"  # bcrypt 해시. install.sh가 주입
openai-compatibility:
  - name: "zai"
    base-url: "https://api.z.ai/api/coding/paas/v4"
    api-key-entries:
      - api-key: "__CLIPROXY_ZAI_API_KEY__"
    models:
      - name: glm-5.2
        alias: ""
    prefix: zai
  - name: deepseek
    prefix: deepseek
    base-url: https://api.deepseek.com
    api-key-entries:
      - api-key: "__CLIPROXY_DEEPSEEK_API_KEY__"
    models:
      - name: deepseek-v4-flash
        alias: ""
      - name: deepseek-v4-pro
        alias: ""
usage-statistics-enabled: true
oauth-model-alias:
  github-copilot:
    - name: claude-haiku-4.5
      alias: claude-haiku-4-5
      fork: true
    - name: claude-opus-4.1
      alias: claude-opus-4-1
      fork: true
    - name: claude-opus-4.5
      alias: claude-opus-4-5
      fork: true
    - name: claude-opus-4.6
      alias: claude-opus-4-6
      fork: true
    - name: claude-sonnet-4.5
      alias: claude-sonnet-4-5
      fork: true
    - name: claude-sonnet-4.6
      alias: claude-sonnet-4-6
      fork: true
  kiro:
    - name: kiro-claude-sonnet-4-6
      alias: claude-sonnet-4-6
      fork: true
    - name: kiro-claude-sonnet-4-5
      alias: claude-sonnet-4-5-20250929
      fork: true
    - name: kiro-claude-sonnet-4-5
      alias: claude-sonnet-4-5
      fork: true
    - name: kiro-claude-sonnet-4
      alias: claude-sonnet-4-20250514
      fork: true
    - name: kiro-claude-sonnet-4
      alias: claude-sonnet-4
      fork: true
    - name: kiro-claude-opus-4-6
      alias: claude-opus-4-6
      fork: true
    - name: kiro-claude-opus-4-5
      alias: claude-opus-4-5-20251101
      fork: true
    - name: kiro-claude-opus-4-5
      alias: claude-opus-4-5
      fork: true
    - name: kiro-claude-haiku-4-5
      alias: claude-haiku-4-5-20251001
      fork: true
    - name: kiro-claude-haiku-4-5
      alias: claude-haiku-4-5
      fork: true
redis-usage-queue-retention-seconds: 60
plugins:
  enabled: true
